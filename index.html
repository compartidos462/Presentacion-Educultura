<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>DC DataCocha · Educultura</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/jspdf.umd.min.js"></script>
<style>
/* Paleta de la presentación: editable desde Configuración. Tema claro fijo a propósito (es una presentación). */
:root{
  --c1:#7BD5F5; --c2:#787FF6; --c3:#4ADEDE; --c4:#1CA7EC; --c5:#1F2F98;
  --txt:#1d2356; --mut:#6b7197; --soft:#f3f6fd; --line:#e2e7f4; --page:#e8edf8; --white:#fff;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.65,0,.35,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
html,body{height:100%}
body{margin:0;background:var(--page);font-family:var(--f);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c4);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g1{background:linear-gradient(135deg,var(--c1),var(--c2))}
.g2{background:linear-gradient(135deg,var(--c3),var(--c4))}
.g3{background:linear-gradient(135deg,var(--c4),var(--c5))}
.g4{background:linear-gradient(135deg,var(--c2),var(--c3))}
.gt{background:linear-gradient(100deg,var(--c4),var(--c2) 55%,var(--c5));-webkit-background-clip:text;background-clip:text;color:transparent}
.gt .w>i{background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent;background-image:linear-gradient(100deg,var(--c4),var(--c2) 55%,var(--c5));background-size:100% 100%}

/* ---------- escenario ---------- */
#view{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(31,47,152,.12)}
body.present #stage{border-radius:0;box-shadow:none}
.bg{position:absolute;inset:0;pointer-events:none}
.blob{position:absolute;left:0;top:0;width:620px;height:620px;transform-origin:center;transition:transform 1.5s var(--io),opacity 1.2s var(--io)}
.blob svg{width:100%;height:100%;animation:spin 38s linear infinite}
.blob:nth-child(2) svg{animation-duration:46s;animation-direction:reverse}
.blob:nth-child(3) svg{animation-duration:54s}
@keyframes spin{to{transform:rotate(360deg)}}
.sl{position:absolute;inset:0;padding:82px 100px;opacity:0;visibility:hidden;transition:opacity .5s var(--io),visibility 0s .5s}
.sl.act{opacity:1;visibility:visible;transition:opacity .5s var(--io)}
.sl.dark{color:#fff}
.sl.dark::before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,var(--c5) 10%,var(--c4) 70%,var(--c3));z-index:-1}
.sl{z-index:1}

h1,h2{margin:0;font-weight:800;letter-spacing:-.035em;line-height:1.02;color:var(--c5)}
h2.tt{font-size:62px;max-width:20ch}
.lead{font-size:24px;line-height:1.5;color:var(--mut);margin:14px 0 0;max-width:46ch}
.kick{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--c4)}

/* ---------- animaciones tipo Canva ---------- */
[data-a]{opacity:0}
.in.done[data-a]{animation:none;opacity:1}
.in[data-a]{animation-duration:.95s;animation-timing-function:var(--ease);animation-fill-mode:both;animation-delay:var(--dl,0s)}
.in[data-a=rise]{animation-name:aRise}
.in[data-a=pop]{animation-name:aPop;animation-timing-function:cubic-bezier(.34,1.56,.64,1);animation-duration:.8s}
.in[data-a=wipe]{animation-name:aWipe;animation-duration:1.1s}
.in[data-a=fade]{animation-name:aFade}
.in[data-a=blur]{animation-name:aBlur;animation-duration:1.2s}
.in[data-a=drift]{animation-name:aDrift}
.in[data-a=drop]{animation-name:aDrop}
.in[data-a=zoom]{animation-name:aZoom;animation-duration:1.2s}
@keyframes aRise{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes aPop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
@keyframes aWipe{from{opacity:1;clip-path:inset(0 100% 0 0 round 20px)}to{opacity:1;clip-path:inset(0 0 0 0 round 20px)}}
@keyframes aFade{from{opacity:0}to{opacity:1}}
@keyframes aBlur{from{opacity:0;filter:blur(18px);transform:scale(1.06)}to{opacity:1;filter:none;transform:none}}
@keyframes aDrift{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes aDrop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes aZoom{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .1em;margin:0 -.02em -.1em}
.w>i{display:inline-block;font-style:normal;transform:translateY(110%)}
.w>i.in{animation:aWord .9s var(--ease) both;animation-delay:var(--dl,0s)}
@keyframes aWord{from{transform:translateY(110%) rotate(4deg)}to{transform:none}}
body.edit [data-a]{opacity:1!important;animation:none!important;clip-path:none!important}
body.edit .w>i{transform:none!important;animation:none!important}
body.edit [data-k]{outline:1.5px dashed rgba(28,167,236,.55);outline-offset:3px;border-radius:4px;cursor:text}
body.edit [data-k]:focus{outline:2px solid var(--c4);background:rgba(123,213,245,.12)}
@media (prefers-reduced-motion: reduce){ .in[data-a],.w>i.in{animation-duration:.01s!important;animation-delay:0s!important} .blob svg{animation:none} }

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;gap:16px}
.mark{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;color:#fff;font-weight:800;font-size:26px;letter-spacing:-.04em}
.mark{cursor:pointer}
.mlw{display:inline-flex;align-items:flex-end;line-height:1}
.ml{display:inline-block;transform-origin:50% 100%;will-change:transform}
.mark.hop .ml{animation:mHop 1.15s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(var(--li)*.13s)}
.mark.tilt .ml{animation:mTilt 1.2s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(var(--li)*.09s)}
.mark.jelly .ml{animation:mJelly 1s ease-out both;animation-delay:calc(var(--li)*.1s)}
.mark.drop .ml{animation:mDrop 1.3s cubic-bezier(.3,0,.3,1) both;animation-delay:calc(.15s + var(--li)*.16s)}
@keyframes mHop{0%{transform:none}12%{transform:scale(1.2,.76)}30%{transform:translateY(-42%) scale(.84,1.2)}48%{transform:translateY(-58%) rotate(-8deg)}64%{transform:scale(1.28,.7)}78%{transform:translateY(-9%) scale(.94,1.07)}90%{transform:scale(1.04,.97)}100%{transform:none}}
@keyframes mTilt{0%{transform:none}15%{transform:scale(1.12,.86)}35%{transform:rotate(-16deg) translateY(-12%)}55%{transform:rotate(10deg) translateY(-6%)}72%{transform:rotate(-5deg) scale(1.06,.95)}100%{transform:none}}
@keyframes mJelly{0%{transform:none}20%{transform:scale(1.3,.72)}40%{transform:scale(.8,1.22)}60%{transform:scale(1.12,.9)}80%{transform:scale(.96,1.04)}100%{transform:none}}
@keyframes mDrop{0%{transform:translateY(-260%) scale(.8,1.25);opacity:0}45%{transform:translateY(0) scale(.85,1.2);opacity:1}58%{transform:scale(1.35,.66)}72%{transform:translateY(-22%) scale(.9,1.12)}84%{transform:scale(1.1,.9)}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){ .mark .ml{animation:none!important} }
.pres{display:grid;gap:10px;margin-bottom:16px}
.pres button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.pres button.on{border-color:var(--c4);box-shadow:0 0 0 2px rgba(28,167,236,.15)}
.pres b{font-size:14px;font-weight:700;color:var(--c5)}
.pres .sws{display:flex;border-radius:10px;overflow:hidden;flex:none}
.pres .sws i{width:24px;height:28px}
.logo .nm{font-weight:800;font-size:34px;letter-spacing:-.03em;color:var(--c5)}
.logo.big .mark{width:150px;height:150px;border-radius:46px;font-size:64px}
.logo.big .nm{font-size:96px}

/* ---------- barra de herramientas ---------- */
.tools{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));z-index:40;display:flex;gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:5px;border-radius:999px;box-shadow:0 6px 24px rgba(31,47,152,.12);transition:opacity .4s}
.tools button{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--c5);font-size:19px}
.tools button:hover{background:var(--soft)}
.tools button.on{background:var(--c5);color:#fff}
.tools .play{background:linear-gradient(135deg,var(--c4),var(--c2));color:#fff}
.tools .play:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--c4),var(--c2))}
.navb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);padding:6px 8px;border-radius:999px;box-shadow:0 6px 24px rgba(31,47,152,.12);transition:opacity .4s}
.navb button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--c5);font-size:18px}
.navb button:hover{background:var(--soft)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:7px;height:7px;border-radius:99px;background:#cfd6ea;transition:width .4s var(--ease),background .4s;cursor:pointer}
.dots i.on{width:26px;background:linear-gradient(90deg,var(--c4),var(--c2))}
body.present .tools,body.present .navb{opacity:0;pointer-events:none}
body.present.mv .tools,body.present.mv .navb{opacity:1;pointer-events:auto}
.toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);background:var(--c5);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- panel lateral y vista general ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);background:#fff;z-index:50;box-shadow:-20px 0 60px rgba(31,47,152,.15);transform:translateX(105%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 12px}
.dh b{font-size:20px;font-weight:800;color:var(--c5)}
.dh button{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--c5)}
.tabs{display:flex;gap:4px;padding:0 22px 12px;flex-wrap:wrap}
.tabs button{border:0;background:var(--soft);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--c5);color:#fff}
.db{flex:1;overflow:auto;padding:6px 22px 24px}
.fld{display:grid;gap:6px;margin-bottom:14px}
.fld span{font-size:13px;font-weight:600;color:var(--mut)}
.fld input[type=text]{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;background:#fff}
.fld input:focus{border-color:var(--c4);outline:none}
.grp{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--c4);margin:18px 0 10px}
.colr{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.colr input[type=color]{width:44px;height:44px;border:0;padding:0;background:none;border-radius:12px;cursor:pointer}
.colr input[type=text]{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.pbtn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;background:var(--soft);color:var(--c5)}
.pbtn.pr{background:linear-gradient(135deg,var(--c4),var(--c2));color:#fff}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;font-size:15px;font-weight:600}
.sw input{display:none}
.sw i{width:46px;height:28px;border-radius:99px;background:#d6dcec;position:relative;transition:.3s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sw input:checked+i{background:linear-gradient(135deg,var(--c4),var(--c2))}
.sw input:checked+i::after{left:21px}
.hint{font-size:13.5px;color:var(--mut);line-height:1.5}
.dfoot{padding:12px 22px 18px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;z-index:45;background:rgba(232,237,248,.94);backdrop-filter:blur(8px);display:none;overflow:auto;padding:80px max(24px,4vw) 40px}
.ov.on{display:block}
.ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;max-width:1200px;margin:0 auto}
.ovg button{border:0;background:#fff;border-radius:18px;padding:18px;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 16px rgba(31,47,152,.06);transition:transform .25s var(--ease)}
.ovg button:hover{transform:translateY(-3px)}
.ovg button b{font-size:13px;color:var(--c4);font-weight:800}
.ovg button span{font-size:18px;font-weight:700;color:var(--c5)}
.ovg button.on{outline:2.5px solid var(--c4)}
.ovt{max-width:1200px;margin:0 auto 14px;font-size:14px;font-weight:600;color:var(--mut)}
.ovg button .mv{display:flex;gap:6px;margin-top:10px}
.ovg button .mv em{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--c5);font-size:16px;font-weight:800}
.ovg button .mv em:hover{background:var(--c4);color:#fff}
.ovg button .mv em.off{opacity:.25;pointer-events:none}
.ovg button.drag{opacity:.4}
.ovg button.over{outline:2.5px dashed var(--c2)}

/* ---------- 1 portada ---------- */
.cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
.cover .tag{font-size:34px;color:var(--mut);font-weight:500;margin:0}
.cover .for{display:inline-flex;gap:10px;align-items:center;font-size:18px;color:var(--mut);background:var(--soft);padding:10px 20px;border-radius:999px}
.cover .for b{color:var(--c5)}
.orb{position:absolute;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:32px;box-shadow:0 14px 30px rgba(31,47,152,.18)}
.orb>.ic{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ---------- 2 hola ---------- */
.hola{display:grid;grid-template-columns:1fr 6px 1fr;gap:80px;height:100%;align-items:center}
.vbar{height:420px;border-radius:9px}
.hola .ab{font-size:27px;line-height:1.5;color:var(--txt);margin:30px 0 30px;max-width:24ch}
.pil{display:flex;gap:12px;flex-wrap:wrap}
.pil span{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:10px 16px;font-size:16px;font-weight:600;color:var(--c5)}
.pil .ic{color:var(--c4)}
.cli{font-size:92px;font-weight:800;letter-spacing:-.04em;color:var(--c5);line-height:1}
.agenda{list-style:none;margin:34px 0 0;padding:0;display:grid;gap:18px}
.agenda li{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600}
.agenda li em{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:800;flex:none}

/* ---------- 3 primera hora ---------- */
.hr{display:grid;grid-template-columns:560px 1fr;gap:90px;align-items:center;height:100%}
.ring{position:relative;width:520px;height:520px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .ctr b{display:block;font-size:84px;font-weight:800;color:var(--c5);letter-spacing:-.04em;line-height:1}
.ring .ctr span{font-size:20px;color:var(--mut)}
.seg{transition:stroke .5s,opacity .5s}
.big7{font-size:230px;font-weight:800;letter-spacing:-.06em;line-height:.9}
.hr p.l2{font-size:30px;line-height:1.4;color:var(--txt);margin:18px 0 0;max-width:22ch;font-weight:600}
.hr .s60{display:inline-flex;align-items:center;gap:14px;margin-top:30px;background:var(--soft);border-radius:999px;padding:12px 22px 12px 12px;font-size:19px;color:var(--c5);font-weight:600}
.hr .s60 b{border-radius:999px;color:#fff;padding:6px 14px;font-size:18px}
.src{font-size:14px;color:var(--mut);margin-top:22px}

/* ---------- 4 lo que vimos ---------- */
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:70px}
.cards4 > div{border-radius:28px;padding:34px 28px;min-height:400px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}
.cards4 .n{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
.cards4 .d{font-size:23px;margin-top:10px;line-height:1.35;font-weight:600;opacity:.95}
.cards4 .ic{font-size:48px;opacity:.9}
.foot4{margin-top:36px;font-size:24px;color:var(--mut)}
.foot4 b{color:var(--c5)}

/* ---------- 5 orden ---------- */
.ttl2{position:relative;height:140px}
.ttl2 h2{position:absolute;left:0;top:0;transition:opacity .6s var(--io),transform .6s var(--io)}
.ttl2 h2:nth-child(2){opacity:0;transform:translateY(18px)}
.dcm .ttl2 h2:nth-child(1){opacity:0;transform:translateY(-18px)}
.dcm .ttl2 h2:nth-child(2){opacity:1;transform:none}
.tog{position:absolute;right:100px;top:92px;display:flex;background:var(--soft);border-radius:999px;padding:5px}
.tog button{border:0;background:transparent;border-radius:999px;padding:10px 20px;font-weight:700;font-size:16px;color:var(--mut)}
.tog button.on{background:#fff;color:var(--c5);box-shadow:0 4px 14px rgba(31,47,152,.1)}
.ordw{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
.ordw .chip{position:absolute;left:0;top:0;width:250px;height:64px;transform:translate(var(--sx),var(--sy)) rotate(var(--sr));transition:transform 1.1s var(--io)}
.dcm .ordw .chip{transform:translate(var(--ox),var(--oy))}
.chip>div{width:100%;height:100%}
.chip .cc{width:100%;height:100%;background:#fff;border-radius:20px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:17px;font-weight:600;box-shadow:0 10px 30px rgba(31,47,152,.1);border:1.5px solid var(--line);animation:bob 4.6s ease-in-out infinite;animation-delay:var(--fd)}
.dcm .chip .cc{animation:none}
.chip .ci{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px}
.qb{position:absolute;background:var(--c5);color:#fff;font-size:17px;font-weight:600;padding:12px 18px;border-radius:20px 20px 20px 6px;transition:opacity .5s,transform .6s var(--ease)}
.dcm .qb{opacity:0!important;transform:scale(.7)!important}
.ordw>svg{position:absolute;inset:0;width:1600px;height:900px;overflow:visible}
.ordw .lines{opacity:0;transition:opacity .6s .4s}
.dcm .ordw .lines{opacity:1}
.ordw .lines path{stroke-dasharray:600;stroke-dashoffset:600;transition:stroke-dashoffset 1.2s var(--io) .5s}
.dcm .ordw .lines path{stroke-dashoffset:0}
.hub{position:absolute;left:690px;top:422px;width:220px;height:220px;border-radius:50%;display:grid;place-items:center;text-align:center;color:#fff;transform:scale(.3);opacity:0;transition:transform .9s cubic-bezier(.34,1.56,.64,1) .6s,opacity .4s .6s;box-shadow:0 24px 60px rgba(31,47,152,.3)}
.dcm .hub{transform:none;opacity:1}
.hub b{font-size:44px;font-weight:800;letter-spacing:-.04em;display:block}
.hub span{font-size:16px;opacity:.9}
.hub::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--c3);opacity:.5;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}

/* config módulos */
.mce{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.mce b{font-size:15px;color:var(--c5)}
.mcr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.mcr label{display:grid;gap:4px}.mcr span{font-size:12px;font-weight:600;color:var(--mut)}

/* burbuja de análisis */
.bbl{position:absolute;z-index:25;width:0;height:0;pointer-events:none}
.bbw{position:absolute;inset:0;z-index:25;pointer-events:none}
.bbk{position:absolute;inset:0;background:rgba(255,255,255,.78);backdrop-filter:blur(5px);animation:aFade .5s both}
.bbw.out{transition:opacity .45s;opacity:0}
.bbl .bb0{position:absolute;left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;opacity:.92;box-shadow:inset -14px -18px 34px rgba(255,255,255,.4),0 20px 50px rgba(31,47,152,.3);animation:bbIn .95s cubic-bezier(.45,0,.2,1) both,bbPop .35s ease-in 1s forwards}
@keyframes bbIn{0%{transform:translate(var(--fx),var(--fy)) scale(.15)}60%{transform:translate(0,0) scale(.9)}80%{transform:scale(1.05,.95)}100%{transform:none}}
@keyframes bbPop{to{transform:scale(1.7);opacity:0}}
.bbl .bbc{position:absolute;left:0;top:0;white-space:nowrap;display:flex;align-items:center;gap:8px;color:#fff;font-size:16px;font-weight:800;padding:10px 16px;border-radius:99px;box-shadow:0 12px 28px rgba(31,47,152,.22);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:bbOut .8s cubic-bezier(.34,1.56,.64,1) var(--bd) forwards}
@keyframes bbOut{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:1}}
.bbl .bbt{position:absolute;left:0;top:-290px;transform:translateX(-50%);white-space:nowrap;font-size:22px;font-weight:700;color:var(--c5);background:#fff;padding:10px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(31,47,152,.15);opacity:0;animation:aFade .5s 1.2s forwards}
.bbl .bbn{position:absolute;left:0;top:-12px;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c4);opacity:0;animation:aFade .5s 1.3s forwards}
/* el postulante elige */
.pick{position:absolute;left:100px;top:300px;width:900px;height:580px}
.pick>svg{position:absolute;inset:0;overflow:visible}

.stq{position:absolute;left:10px;top:160px;width:280px;font-size:18px;font-weight:700;color:var(--c5);background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 10px 26px rgba(31,47,152,.1)}
.ag{position:absolute}
.ag>div{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px 18px;min-width:330px;box-shadow:0 10px 28px rgba(31,47,152,.09);transition:transform .5s var(--ease),opacity .5s,box-shadow .5s}

.ag.lit .ck{opacity:1;transform:none}
.ag.dim>div{opacity:.45}
.pst{position:absolute;right:100px;top:300px;width:470px;display:grid;gap:18px}
.pst>div{border-radius:26px;padding:26px 30px;color:#fff}
.pst .n{display:block;font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1}
.pst p{margin:10px 0 0;font-size:19px;font-weight:600;line-height:1.45}
.pst small{font-size:14px;color:var(--mut);line-height:1.5}
/* competencia */
.cph{display:flex;align-items:flex-end;justify-content:space-between}
.tog2{display:flex;gap:4px;background:var(--soft);padding:5px;border-radius:99px}

.cmap circle.ku{fill:var(--c5);stroke:#fff;stroke-width:6;filter:drop-shadow(0 10px 20px rgba(31,47,152,.3))}
.cmx{border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.cr{display:grid;grid-template-columns:260px repeat(8,1fr) 70px;align-items:center;border-top:1px solid var(--line);min-height:52px}

.cr.ch{background:var(--soft)}.cr.ch span{font-size:12.5px;font-weight:800;color:var(--c4);text-transform:uppercase;letter-spacing:.04em;line-height:1.2}

.cr i{display:inline-block;width:20px;height:20px;border-radius:50%}
